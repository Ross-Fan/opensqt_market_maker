####################################

trading:
  symbol: "ETHUSDT"
  price_interval: 2         # 价格间隔（1美元）
  order_quantity: 30        # 每单购买金额（USDT/USDC）如 30 表示每单投入30U
  min_order_value: 20       # 最小订单价值（USDT），小于此值不挂单（默认20U）
  # 注意：price_decimals 和 quantity_decimals 已移除，现在从交易所自动获取
  
  #ETH配置建议(每单赚1美分):
  #价格间隔：1 美元
  #订单金额：30 USDT（每单投入30U，价格3000时买0.01 ETH，价格1500时买0.02 ETH）
  #价格小数位数：2
  #数量小数位数：3

  #ETH配置建议(每单赚10美分):
  #价格间隔：10 美元
  #订单金额：300 USDT (每单投入300U，需要大量保证金)
  #价格小数位数：2

  #DOGE建议（每单赚2美分）：
  #价格间隔：0.0001 美元
  #订单金额：20 USDT（价格0.1时买200 DOGE，价格0.2时买100 DOGE）
  #价格小数位数：6

#####################################

  # 滑动窗口配置
  buy_window_size: 10          # 下方买单数量
  sell_window_size: 10         # 上方卖单数量

  # 对账配置
  reconcile_interval: 60      # 对账间隔（秒）

  # 订单管理配置
  order_cleanup_threshold: 50      # 订单清理上限（超过此数量时触发清理）
  cleanup_batch_size: 20           # 清理批次大小（每次清理的买单和卖单数量）
  margin_lock_duration_seconds: 20  # 保证金不足时锁定时间（秒，默认10秒）
  
  # 持仓安全性配置
  position_safety_check: 100        # 持仓安全性检查（默认100，最少能向下持有多少仓）


# 时间间隔配置
timing:
  # WebSocket相关
  websocket_reconnect_delay: 5      # WebSocket断线重连等待时间（秒，默认5）
  websocket_write_wait: 10          # WebSocket写入等待时间（秒，默认10）
  websocket_pong_wait: 60           # WebSocket PONG等待时间（秒，默认60）
  websocket_ping_interval: 20       # WebSocket PING间隔（秒，默认20）
  listen_key_keepalive_interval: 30 # listenKey保活间隔（分钟，默认30）

  # 价格监控相关
  price_send_interval: 50           # 定期发送价格的间隔（毫秒，默认50）

  # 订单执行相关
  rate_limit_retry_delay: 1         # 速率限制重试等待时间（秒，默认1）
  order_retry_delay: 500            # 其他错误重试等待时间（毫秒，默认500）
  price_poll_interval: 500          # 等待获取价格的轮询间隔（毫秒，默认500）
  status_print_interval: 1          # 定期打印状态的间隔（分钟，默认1）
  order_cleanup_interval: 10        # 订单清理检查间隔（秒，默认10）

system:
  # 日志级别: DEBUG(调试) / INFO(信息) / WARN(警告) / ERROR(错误) / FATAL(致命)
  # DEBUG: 输出所有日志，包括调试信息（最详细）
  # INFO: 输出一般信息、警告、错误和致命错误（推荐生产环境）
  # WARN: 只输出警告、错误和致命错误
  # ERROR: 只输出错误和致命错误
  # FATAL: 只输出致命错误
  log_level: "INFO"
  cancel_on_exit: true        # 退出时撤销所有订单（默认开启true,关闭用false）

# 主动安全风控配置（基于移动平均线）
risk_control:
  enabled: true               # 是否启用风控（默认开启true,关闭用false）

  # 监控的主流币种（用于判断市场整体情绪）
  monitor_symbols:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "XRPUSDT"
    - "DOGEUSDT"

  interval: "1m"              # K线周期：1m / 3m / 5m
  volume_multiplier: 3.0      # 成交量倍数：当前量 > 均值×3倍视为异常
  average_window: 20          # 移动平均窗口：50根K线
  recovery_threshold: 3       # 恢复交易所需的正常币种数量（默认3个币种恢复正常即可恢复交易）

  # 触发条件：当前价格 < 移动均价 且 成交量 > 均值×倍数
  # 解除条件：至少 recovery_threshold 个币种满足（当前价格 > 移动均价 且 成交量 < 均值×倍数）

# 下跌趋势保护配置（单币种趋势检测，避免追跌）
# 功能：检测交易币种的下跌趋势，在下跌过程中暂停买入，待价格稳定后自动恢复交易
# 与 risk_control 的区别：
#   - risk_control: 监控多个主流币种，判断整体市场情绪（全市场崩盘保护）
#   - downtrend_protection: 只监控交易币种本身，检测单币种的下跌趋势（避免追跌）
downtrend_protection:
  enabled: true               # 是否启用下跌趋势保护（默认开启true,关闭用false）

  # EMA参数：用于趋势判断
  ema_short: 10               # 短期EMA周期（快线），默认10
  ema_long: 30                # 长期EMA周期（慢线），默认30

  # 触发条件
  drop_threshold_percent: 3.0 # 从近期高点跌幅超过此百分比触发暂停买入，默认3%

  # 稳定检测参数
  stabilize_candles: 12       # 无新低的K线数量判定为稳定，默认12根
  range_threshold_percent: 1.5 # 价格波动区间收窄至此百分比以下视为稳定，默认1.5%
  candle_interval: "15m"      # K线周期，建议用15m或5m，默认15m

  # 持仓限制（可选，防止过度累积持仓）
  max_filled_positions: 0     # 最大持仓槽位数量，0表示不限制

  # 工作原理：
  # 1. 价格从高点下跌超过 drop_threshold_percent% 且 价格低于EMA短线 → 触发暂停买入
  # 2. 暂停期间只挂卖单，不新增买单，已有买单会被撤销
  # 3. 当价格稳定（连续 stabilize_candles 根K线未创新低 且 波动<range_threshold_percent%）→ 恢复买入
  # 4. 恢复时在当前价格重新锚定网格，不等待价格回到原高点

  # 趋势自适应网格配置（利用EMA10/EMA30计算趋势强度，动态调整网格参数）
  # 核心思想：上涨时多买多赚，下跌时少买快跑
  trend_adaptive:
    enabled: true               # 是否启用趋势自适应（默认开启）

    # 买入间距乘数：控制网格密度（上涨时密集，下跌时稀疏）
    buy_spacing_mult_min: 0.7   # 最小乘数（强上涨时密集买入），默认0.7
    buy_spacing_mult_max: 1.3   # 最大乘数（强下跌时稀疏买入），默认1.3

    # 卖出利润目标乘数：控制止盈速度（下跌时小利就跑）
    sell_target_mult_min: 0.8   # 最小乘数（强下跌时快速止盈），默认0.8
    sell_target_mult_max: 1.2   # 最大乘数（强上涨时正常止盈），默认1.2

    # 买入窗口乘数：控制持仓积累量（上涨时激进，下跌时保守）
    buy_window_mult_min: 0.6    # 最小乘数（强下跌时缩小买入窗口），默认0.6
    buy_window_mult_max: 1.4    # 最大乘数（强上涨时放大买入窗口），默认1.4

    # 卖出窗口乘数：控制卖出范围（下跌时更多卖出机会）
    sell_window_mult_min: 0.8   # 最小乘数（强上涨时缩小卖出窗口），默认0.8
    sell_window_mult_max: 1.2   # 最大乘数（强下跌时放大卖出窗口），默认1.2

  # 工作示例（假设 price_interval=5, buy_window=10）：
  # - 强上涨(EMA10比EMA30高2%)：BuySpacing=0.7×5=3.5, BuyWindow=1.4×10=14个槽位
  #   → 更密集买入（多做网格），更多持仓（多赚）
  # - 强下跌(EMA10比EMA30低2%)：BuySpacing=1.3×5=6.5, SellTarget=0.8×5=4
  #   → 更稀疏买入（少亏），小利就跑（快速退出），BuyWindow=0.6×10=6个槽位（少累积）
  # - 震荡市(EMA10≈EMA30)：所有乘数≈1.0，使用原始参数

  # 示例场景（SOL从89跌到84）：
  # - 价格89 → 86（跌3.4%）→ 触发暂停买入
  # - 价格继续跌到84 → 保持暂停，不买入（避免损失）
  # - 价格在84附近波动12根15分钟K线，波动<1.5% → 判定稳定
  # - 在84附近恢复交易，重新开始网格（不等待涨回89）
